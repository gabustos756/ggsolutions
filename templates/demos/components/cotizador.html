<!-- MÓDULO INTERACTIVO: SIMULADOR / COTIZADOR EN VIVO -->
<div class="glass-card rounded-2xl p-6 sm:p-8 max-w-4xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/10 pb-4">
        <div>
            <h4 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-sliders text-cyan-400"></i> Simulador de Presupuesto en Vivo
            </h4>
            <p class="text-xs text-slate-400">Seleccioná las características de tu requerimiento y obtené una estimación transparente al instante.</p>
        </div>
        <span class="px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 rounded-full text-xs font-semibold">
            <i class="fa-solid fa-bolt"></i> Cotización Inmediata
        </span>
    </div>

    <!-- PASOS DEL SIMULADOR -->
    <div class="space-y-5">
        
        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">1. Alcance / Tipo de Servicio</label>
            <select id="cotiz-tipo" onchange="recalcularCotizacion()" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
                <option value="45000">Servicio Básico / Estándar - ($45.000 ARS)</option>
                <option value="85000" selected>Servicio Profesional Completo - ($85.000 ARS)</option>
                <option value="150000">Servicio Premium / Enterprise - ($150.000 ARS)</option>
            </select>
        </div>

        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300">2. Adicionales Deseados</label>
            <div class="grid sm:grid-cols-2 gap-3 text-xs">
                <label class="flex items-center gap-2 p-3 bg-white/5 border border-white/10 rounded-xl cursor-pointer hover:bg-white/10">
                    <input type="checkbox" id="add-urgente" onchange="recalcularCotizacion()" class="rounded border-white/20 bg-slate-900 text-cyan-400">
                    <span>Atención Prioritaria / Urgente (+20%)</span>
                </label>
                <label class="flex items-center gap-2 p-3 bg-white/5 border border-white/10 rounded-xl cursor-pointer hover:bg-white/10">
                    <input type="checkbox" id="add-garantia" onchange="recalcularCotizacion()" class="rounded border-white/20 bg-slate-900 text-cyan-400" checked>
                    <span>Garantía Extendida (+10%)</span>
                </label>
            </div>
        </div>

        <!-- RESUMEN FINAL -->
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950/80 border border-cyan-500/30 rounded-xl p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <p class="text-xs text-slate-400 uppercase font-semibold">Estimación de Presupuesto</p>
                <p id="total-cotizacion" class="text-3xl font-extrabold text-cyan-400">$93.500 ARS</p>
                <p class="text-[10px] text-slate-400 mt-0.5">*Sujeto a confirmación técnica en inspección/reunión.</p>
            </div>
            <button onclick="enviarCotizacionWA()" class="bg-gradient-to-r {{ theme.gradient }} text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg hover:opacity-95 transition flex items-center gap-2 text-sm w-full sm:w-auto justify-center">
                <i class="fa-brands fa-whatsapp"></i> Solicitar Presupuesto Oficial
            </button>
        </div>

    </div>
</div>

<script>
    function recalcularCotizacion() {
        let base = parseFloat(document.getElementById('cotiz-tipo').value);
        if (document.getElementById('add-urgente').checked) base *= 1.20;
        if (document.getElementById('add-garantia').checked) base *= 1.10;

        const total = Math.round(base);
        document.getElementById('total-cotizacion').innerText = `$${total.toLocaleString('es-AR')} ARS`;
    }

    function enviarCotizacionWA() {
        const total = document.getElementById('total-cotizacion').innerText;
        const msg = `Hola {{ demo.nombre_negocio }}, estuve simulando un presupuesto en su sitio web y me dio un valor estimado de ${total}. Me gustaría solicitar la cotización formal.`;
        window.open(`https://wa.me/{{ wa_clean }}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
