<!-- MÓDULO INTERACTIVO: AGENDA & TURNOS DIGITALES -->
<div class="glass-card rounded-2xl p-6 sm:p-8 max-w-4xl mx-auto space-y-6 border border-white/10 shadow-2xl">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/10 pb-4">
        <div>
            <h4 class="text-lg font-bold text-white flex items-center gap-2 font-title">
                <i class="fa-regular fa-calendar-check text-cyan-400"></i> Reservá tu Turno en Línea
            </h4>
            <p class="text-xs text-slate-300">Seleccioná el servicio, especialista y la fecha deseada sin llamadas ni esperas.</p>
        </div>
        <span class="px-3.5 py-1.5 bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-md">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Turnos Disponibles Hoy
        </span>
    </div>

    <!-- PASO 1: SELECCIÓN VISUAL DE SERVICIO -->
    <div class="space-y-3">
        <label class="text-xs font-bold uppercase tracking-wider text-cyan-400">1. Seleccioná la Modalidad o Servicio</label>
        <div class="grid sm:grid-cols-3 gap-4">
            <button type="button" onclick="selectServicio(this, 'Consulta Inicial / Diagnóstico')" class="srv-btn glass-card glass-card-hover p-4 rounded-xl border border-white/10 bg-white/5 hover:border-cyan-400 text-left transition space-y-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-cyan-400">Paso 1</span>
                    <i class="fa-solid fa-stethoscope text-slate-400"></i>
                </div>
                <p class="text-sm font-bold text-white font-title">Diagnóstico & Consulta</p>
                <p class="text-xs text-slate-300">Duración: 30 min | Evaluación integral</p>
            </button>
            <button type="button" onclick="selectServicio(this, 'Atención Especializada')" class="srv-btn glass-card glass-card-hover p-4 rounded-xl border-2 border-cyan-400 bg-cyan-500/10 text-left transition space-y-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-cyan-300">Recomendado</span>
                    <i class="fa-solid fa-star text-amber-400"></i>
                </div>
                <p class="text-sm font-bold text-white font-title">Atención Especializada</p>
                <p class="text-xs text-slate-300">Duración: 45 min | Asesoramiento Premium</p>
            </button>
            <button type="button" onclick="selectServicio(this, 'Revisión de Control')" class="srv-btn glass-card glass-card-hover p-4 rounded-xl border border-white/10 bg-white/5 hover:border-cyan-400 text-left transition space-y-1.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-400">Control</span>
                    <i class="fa-solid fa-shield-check text-slate-400"></i>
                </div>
                <p class="text-sm font-bold text-white font-title">Revisión de Control</p>
                <p class="text-xs text-slate-300">Duración: 20 min | Seguimiento rápido</p>
            </button>
        </div>
    </div>

    <!-- PASO 2: FECHA Y HORARIO CON CHIPS ANIMADOS -->
    <div class="grid sm:grid-cols-2 gap-6 pt-2">
        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-cyan-400">2. Fecha Preferida</label>
            <input type="date" id="fecha-turno" class="w-full bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" value="2026-08-06">
        </div>
        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-cyan-400">3. Horario Disponible</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectHora(this, '10:00 hs')" class="hora-btn py-2.5 text-xs font-semibold rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-300 transition">10:00 hs</button>
                <button type="button" onclick="selectHora(this, '11:30 hs')" class="hora-btn py-2.5 text-xs rounded-xl border-2 border-cyan-400 bg-cyan-500/20 text-cyan-300 font-extrabold shadow-md">11:30 hs</button>
                <button type="button" onclick="selectHora(this, '16:00 hs')" class="hora-btn py-2.5 text-xs font-semibold rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 text-slate-300 transition">16:00 hs</button>
            </div>
        </div>
    </div>

    <!-- DATOS DE CONFIRMACIÓN -->
    <div class="space-y-3 pt-2">
        <label class="text-xs font-bold uppercase tracking-wider text-cyan-400">4. Datos de Confirmación</label>
        <div class="grid sm:grid-cols-2 gap-3">
            <input type="text" id="nombre-cliente" placeholder="Tu Nombre Completo" class="bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
            <input type="tel" id="tel-cliente" placeholder="Tu WhatsApp (ej: 3515551234)" class="bg-slate-900 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
        </div>
    </div>

    <button type="button" onclick="confirmarTurnoDemo()" class="w-full bg-gradient-to-r {{ theme.gradient }} text-slate-950 font-extrabold py-3.5 rounded-xl shadow-xl hover:scale-[1.01] transition flex items-center justify-center gap-2 text-base">
        <i class="fa-brands fa-whatsapp text-lg"></i> Confirmar Turno por WhatsApp
    </button>
</div>

<script>
    let servicioSeleccionado = 'Atención Especializada';
    let horaSeleccionada = '11:30 hs';

    function selectServicio(btn, nombre) {
        document.querySelectorAll('.srv-btn').forEach(b => {
            b.classList.remove('border-2', 'border-cyan-400', 'bg-cyan-500/10');
            b.classList.add('border', 'border-white/10', 'bg-white/5');
        });
        btn.classList.remove('border', 'border-white/10', 'bg-white/5');
        btn.classList.add('border-2', 'border-cyan-400', 'bg-cyan-500/10');
        servicioSeleccionado = nombre;
    }

    function selectHora(btn, hora) {
        document.querySelectorAll('.hora-btn').forEach(b => {
            b.classList.remove('border-2', 'border-cyan-400', 'bg-cyan-500/20', 'text-cyan-300', 'font-extrabold');
            b.classList.add('border', 'border-white/10', 'bg-white/5', 'text-slate-300');
        });
        btn.classList.remove('border', 'border-white/10', 'bg-white/5', 'text-slate-300');
        btn.classList.add('border-2', 'border-cyan-400', 'bg-cyan-500/20', 'text-cyan-300', 'font-extrabold');
        horaSeleccionada = hora;
    }

    function confirmarTurnoDemo() {
        const nombre = document.getElementById('nombre-cliente').value.trim() || 'Cliente';
        const fecha = document.getElementById('fecha-turno').value || 'Próximo disponible';
        const msg = `Hola {{ demo.nombre_negocio }}, mi nombre es ${nombre}. Quisiera reservar el turno para: ${servicioSeleccionado} el día ${fecha} a las ${horaSeleccionada}.`;
        window.open(`{{ wa_link }}&text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
