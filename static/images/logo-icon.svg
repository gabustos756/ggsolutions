<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Gradiente Verde Estilo Apple Tech: Esmeralda sofisticado a Menta luminoso -->
    <linearGradient id="apple-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Apple Style -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B0F17" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Escultural "G" Estilo Tipografía Apple Minimalista -->
  <g filter="url(#soft-glow)">
    <!-- Curva G continua -->
    <path 
      d="M31.5 17.5
         C29.2 14.5 25.8 13 22 13
         C14.8 13 9.5 18.2 9.5 25.5
         C9.5 32.8 14.8 38 22.2 38
         C29.2 38 34.5 33.2 34.5 26.2
         V24
         H22.5
         C21.4 24 20.5 24.9 20.5 26
         C20.5 27.1 21.4 28 22.5 28
         H30.2
         C29.6 32 26.5 34.2 22.2 34.2
         C17.2 34.2 13.5 30.5 13.5 25.5
         C13.5 20.5 17.2 16.8 22 16.8
         C24.8 16.8 27.2 18 28.8 20.2
         C29.5 21 30.7 21.2 31.5 20.4
         C32.3 19.6 32.2 18.3 31.5 17.5 Z" 
      fill="url(#apple-green-grad)" 
    />
    
    <!-- Punto Característico "G." (Apple Minimal Dot) -->
    <circle cx="37.5" cy="35.5" r="2.2" fill="#34D399" />
  </g>
</svg>
